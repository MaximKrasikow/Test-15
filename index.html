<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Отчет Водителя</title>
    
    <!-- PWA и мета-теги для мобильных устройств -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1971c2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Отчет">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <style>
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 12px; 
            max-width: 500px; 
            margin: auto; 
            background: #f1f3f5; 
            color: #212529; 
            -webkit-user-select: none;
            user-select: none;
        }
        .card { 
            background: #ffffff; 
            padding: 18px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
        }
        h2 { 
            margin: 0 0 12px 0; 
            font-size: 19px; 
            text-align: center; 
        }
        .badge { 
            display: block; 
            text-align: center; 
            padding: 6px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: 700; 
            margin-bottom: 14px; 
        }
        .badge.online { background: #d3f9d8; color: #2b8a3e; }
        .badge.offline { background: #ffe3e3; color: #c92a2a; }
        
        .field { margin-bottom: 12px; }
        label { 
            display: block; 
            margin-bottom: 4px; 
            font-weight: 600; 
            font-size: 13px; 
            color: #495057; 
        }
        input, textarea { 
            width: 100%; 
            padding: 11px; 
            font-size: 16px; /* 16px предотвращает автозум в iOS Safari */
            border: 1px solid #ced4da; 
            border-radius: 8px; 
            outline: none; 
            background: #fff;
            -webkit-user-select: auto;
            user-select: auto;
        }
        input:focus, textarea:focus { border-color: #1971c2; }
        .row-2 { display: flex; gap: 10px; }
        .row-2 .field { flex: 1; }

        input[type="file"] {
            padding: 8px;
            background: #f8f9fa;
            font-size: 14px;
        }

        button { 
            width: 100%; 
            background: #1971c2; 
            color: #ffffff; 
            border: none; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: 700; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 6px; 
            touch-action: manipulation;
        }
        button:active { background: #1864ab; }
        button:disabled { 
            background: #adb5bd; 
            cursor: not-allowed; 
            opacity: 0.8;
        }

        #status { 
            margin-top: 12px; 
            padding: 10px; 
            border-radius: 6px; 
            background: #e9ecef; 
            text-align: center; 
            font-size: 12px; 
            font-weight: 600; 
            line-height: 1.4;
            color: #495057;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="netStatus" class="badge online">● Подключение: Онлайн</div>
        <h2>Отчет экспедитора</h2>

        <div class="field">
            <label>ФИО Водителя (сохраняется в памяти):</label>
            <input type="text" id="username" placeholder="Иванов Иван" autocomplete="name">
        </div>

        <div class="field">
            <label>1. Торговая точка *</label>
            <input type="text" id="pointName" placeholder="Название магазина или адрес" required>
        </div>

        <div class="field">
            <label>2. Показания счетчика</label>
            <!-- inputmode="numeric" дает цифровую клавиатуру, сохраняя ведущие нули -->
            <input type="text" id="meter" inputmode="numeric" pattern="[0-9]*" placeholder="Значение счетчика">
        </div>

        <div class="row-2">
            <div class="field">
                <label>3. Мелкие (шт)</label>
                <input type="number" id="smallToys" inputmode="numeric" placeholder="0" min="0">
            </div>
            <div class="field">
                <label>4. Заманухи (шт)</label>
                <input type="number" id="zamanukha" inputmode="numeric" placeholder="0" min="0">
            </div>
        </div>

        <div class="field">
            <label>5. Проброс</label>
            <input type="text" id="probros" placeholder="Количество или комментарий">
        </div>

        <div class="field">
            <label>6. Проблемы на маршруте</label>
            <textarea id="problems" rows="2" placeholder="Опишите проблему (если всё ок — пусто)"></textarea>
        </div>

        <div class="field">
            <label>7. Фотография (счетчик / витрина)</label>
            <input type="file" id="photo" accept="image/*">
        </div>

        <button type="button" id="submitBtn" onclick="handleFormSubmit()">ОТПРАВИТЬ ДАННЫЕ</button>
        <div id="status">Готово к заполнению</div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
